version: '3.8'

services:
  # Prometheus
  devops-prometheus:
    image: prom/prometheus
    container_name: devops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  # Grafana
  devops-grafana:
    image: grafana/grafana
    container_name: devops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password

  # Application Service
  devops-service:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: devops-service
    depends_on:
      devops-database:
        condition: service_healthy
    restart: always
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      SPRING_APPLICATION_NAME: devops-service
      SPRING_DATASOURCE_URL: jdbc:mysql://devops-database:3306/devops_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_MAIL_USERNAME: my.schooletest123@gmail.com
      SPRING_MAIL_PASSWORD: pgqprlaqqpsczhoh
      JWT_SECRET: your-256-bit-secret-key-should-be-long-enough
      JWT_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 86400000

  # MySQL Database
  devops-database:
    image: mysql:8.0
    container_name: devops-database
    restart: always
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops_db
    volumes:
      - ./data/mysql:/var/lib/mysql


  # SonarQube Database
  devops-sonarqube-db:
    image: postgres:13
    container_name: devops-sonarqube-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - devops_sonarqube_postgres_data:/var/lib/postgresql/data
    networks:
      - sonarnet

  # SonarQube
  devops-sonarqube:
    image: sonarqube:latest
    container_name: devops-sonarqube
    depends_on:
      - devops-sonarqube-db
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://devops-sonarqube-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - devops_sonarqube_data:/opt/sonarqube/data
      - devops_sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - sonarnet

  # Frontend
  devops-frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      devops-service:
        condition: service_healthy
      devops-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  devops_mysql_data:
  devops_sonarqube_postgres_data:
  devops_sonarqube_data:
  devops_sonarqube_extensions:

networks:
  sonarnet:
    driver: bridge

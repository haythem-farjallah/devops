services:
  # Application Service
  devops-service:
    image: haythem25/khlail-2:backend-latest
    container_name: devops-service
    depends_on:
      devops-database:
        condition: service_healthy
    restart: always
    ports:
      - "8082:8082"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      SPRING_APPLICATION_NAME: devops-service
      SPRING_DATASOURCE_URL: jdbc:mysql://devops-database:3306/devops_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_MAIL_USERNAME: my.schooletest123@gmail.com
      SPRING_MAIL_PASSWORD: pgqprlaqqpsczhoh
      JWT_SECRET: your-256-bit-secret-key-should-be-long-enough
      JWT_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 86400000
    networks:
      - dev

  # MySQL Database
  devops-database:
    image: mysql:8.0
    container_name: devops-database
    restart: always
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops_db
    volumes:
      - ./../data/mysql:/var/lib/mysql
    networks:
      - dev

  # Frontend
  devops-frontend:
    image: haythem25/khlail-2:front-latest
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      devops-service:
        condition: service_healthy
      devops-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  devops_mysql_data:

networks:
  dev:
    driver: bridge
